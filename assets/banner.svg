<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>

    <!-- Glowing Orb Gradients -->
    <radialGradient id="orbGrad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbGrad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="speedMeterGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff87" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#60efff" stop-opacity="0.2" />
    </radialGradient>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 12px;
        fill: #e2e8f0;
      }
      .metric-score {
        font-family: 'SF Mono', Consolas, Monaco, monospace;
        font-weight: 700;
        font-size: 38px;
        fill: #00ff87;
      }
      .metric-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        font-size: 11px;
        fill: #94a3b8;
      }

      /* Dynamic Animations */
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { transform: translateY(-15px) translateX(8px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.08); }
      }
      @keyframes waveDash {
        to { stroke-dashoffset: -100; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes scorePulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
      }

      .p1 { animation: floatParticle 6s ease-in-out infinite; }
      .p2 { animation: floatParticle 8s ease-in-out infinite 1s; }
      .p3 { animation: floatParticle 7s ease-in-out infinite 2s; }
      .glow-orb { transform-origin: center; animation: pulseGlow 8s ease-in-out infinite; }
      .wave-line {
        stroke-dasharray: 8 6;
        animation: waveDash 10s linear infinite;
      }
      .score-circle {
        transform-origin: 1040px 185px;
        animation: scorePulse 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Background Orbs (Placed strictly in background behind all text) -->
  <circle cx="150" cy="100" r="180" fill="url(#orbGrad1)" class="glow-orb" />
  <circle cx="1050" cy="280" r="220" fill="url(#orbGrad2)" class="glow-orb" />

  <!-- Subtle High-Tech Grid Pattern in Background -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Dynamic Wave Curve in Background (Non-intrusive) -->
  <path d="M 0,330 Q 300,280 600,340 T 1200,300" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3" class="wave-line" />
  <path d="M 0,350 Q 300,310 600,360 T 1200,330" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.2" class="wave-line" />

  <!-- Floating Ambient Tech Nodes -->
  <circle cx="750" cy="90" r="4" fill="#00f2fe" class="p1" />
  <circle cx="890" cy="140" r="5" fill="#38bdf8" class="p2" />
  <circle cx="680" cy="270" r="3.5" fill="#a78bfa" class="p3" />
  <circle cx="180" cy="330" r="4" fill="#00ff87" class="p1" />

  <!-- Right Side Interactive Performance Gauge Widget (Kept on far right) -->
  <g class="score-circle">
    <!-- Outer Target Ring -->
    <circle cx="1040" cy="185" r="75" fill="#13233c" stroke="#334155" stroke-width="8" opacity="0.9" />
    <!-- Progress Indicator Arc -->
    <circle cx="1040" cy="185" r="75" fill="none" stroke="#00ff87" stroke-width="8" stroke-dasharray="471" stroke-dashoffset="35" stroke-linecap="round" />
    <!-- Center Score -->
    <text x="1040" y="190" text-anchor="middle" class="metric-score">100</text>
    <text x="1040" y="215" text-anchor="middle" class="metric-label">PERFORMANCE</text>
    <text x="1040" y="232" text-anchor="middle" font-size="10" fill="#38bdf8" font-family="-apple-system, sans-serif">CORE WEB VITALS</text>
  </g>

  <!-- FOREGROUND CONTENT: Title, Subtitle, Category Pills -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Tag -->
    <g transform="translate(0, 75)">
      <rect width="265" height="30" rx="15" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1.2" />
      <circle cx="16" cy="15" r="5" fill="#00ff87" />
      <text x="30" y="20" class="tag-text">CURATED WEB PERFORMANCE ECOSYSTEM</text>
    </g>

    <!-- Main Title (Strictly Foreground) -->
    <text x="0" y="155" class="title-text">Awesome Front-End Performance</text>

    <!-- Subtitle (Strictly Foreground) -->
    <text x="0" y="200" class="subtitle-text">The definitive guide to Core Web Vitals, synthetic audits, RUM &amp; testing tools.</text>

    <!-- Feature Pills Bar -->
    <g transform="translate(0, 245)">
      <!-- Pill 1: Core Web Vitals -->
      <g transform="translate(0, 0)">
        <rect width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="15" y="21" class="pill-text">⚡ Core Web Vitals</text>
      </g>
      <!-- Pill 2: Synthetic Testing -->
      <g transform="translate(157, 0)">
        <rect width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="15" y="21" class="pill-text">🔬 Synthetic Testing</text>
      </g>
      <!-- Pill 3: RUM & Metrics -->
      <g transform="translate(314, 0)">
        <rect width="130" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="15" y="21" class="pill-text">📊 RUM Metrics</text>
      </g>
      <!-- Pill 4: Open Source & SaaS -->
      <g transform="translate(456, 0)">
        <rect width="160" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="15" y="21" class="pill-text">🚀 SaaS &amp; Open-Source</text>
      </g>
      <!-- Pill 5: CI/CD Automation -->
      <g transform="translate(628, 0)">
        <rect width="140" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="15" y="21" class="pill-text">🛠️ CI/CD Audits</text>
      </g>
    </g>

    <!-- Sub-tagline -->
    <text x="0" y="325" font-family="-apple-system, sans-serif" font-size="14" fill="#64748b">
      Auditing engines, load testing frameworks, performance budgets, and cloud observability solutions.
    </text>
  </g>
</svg>
